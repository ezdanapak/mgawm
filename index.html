<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2a1224">
    <title>მოდი! გეძახი ათას წლის მერე</title>
    <meta name="description" content="გალაკტიონ ტაბიძე — ვარდის ფურცლების ცვენა">
    <link rel="canonical" href="https://mgawm.qgis.ge/">

    <!-- Favicon -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">

    <!-- Open Graph / Facebook / Messenger -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mgawm.qgis.ge/">
    <meta property="og:title" content="მოდი! გეძახი ათას წლის მერე">
    <meta property="og:description" content="გალაკტიონ ტაბიძე — ვარდის ფურცლების ცვენა">
    <meta property="og:image" content="https://mgawm.qgis.ge/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="მოდი! გეძახი ათას წლის მერე — ვარდის ფურცლები">
    <meta property="og:locale" content="ka_GE">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="მოდი! გეძახი ათას წლის მერე">
    <meta name="twitter:description" content="გალაკტიონ ტაბიძე — ვარდის ფურცლების ცვენა">
    <meta name="twitter:image" content="https://mgawm.qgis.ge/og.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="roseCanvas" aria-hidden="true"></canvas>

    <section class="hero">
        <div class="stage">
            <blockquote id="poem" class="poem" aria-label="ლექსი">
                <span class="line" style="--i:0">მოდი! გეძახი ათას წლის მერე,</span>
                <span class="line" style="--i:1">დამნაცროს ელვამ შენი ტანისა;</span>
                <span class="line" style="--i:2">ვარდის ფურცლობის ნიშანი არი</span>
                <span class="line" style="--i:3">და დრო ახალი პაემანისა!..</span>
            </blockquote>
            <footer class="sign">გალაკტიონ ტაბიძე</footer>
        </div>
        <a class="scroll-hint" href="#place" aria-label="ჩამოსქროლე">
            <span>ის ადგილი</span>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
    </section>

    <section id="place" class="place">
        <div id="map" role="img" aria-label="რუკა — ის ადგილი, სადაც ველოდი"></div>
        <p class="place-caption">მე აქ ველოდებოდი<br><span>და ის არ მოვიდა</span></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
